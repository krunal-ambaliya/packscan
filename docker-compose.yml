version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: packscan-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/packscan_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - SECRET_KEY=doca_packscan_super_secret_jwt_key_sih_2024_secure
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - ./rules:/rules
    networks:
      - packscan-net

  ml_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: packscan-ml-worker
    command: celery -A backend.ml.celery_worker.celery_app worker --loglevel=info -c 2
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/packscan_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - ./rules:/rules
    networks:
      - packscan-net

  postgres:
    image: postgres:15-alpine
    container_name: packscan-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=packscan_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - packscan-net

  redis:
    image: redis:7-alpine
    container_name: packscan-redis
    ports:
      - "6379:6379"
    networks:
      - packscan-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: packscan-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - packscan-net

networks:
  packscan-net:
    driver: bridge

volumes:
  postgres_data:
